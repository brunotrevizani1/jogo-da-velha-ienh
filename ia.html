<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Jogo da Velha IA</title>
  </head>
  <body>
    <div class="cabecalho">
      <h1 class="titulo">Jogo da velha vs IA</h1>
      <h2 class="subtitulo">Escolha a dificuldade!</h2>
    </div>

    <div class="pai">
      <a href="index.html">
        <button class="filho1">Jogar contra amigo</button>
      </a>

      <select onchange="dificuldade = this.value">
        <option value="facil">Fácil</option>
        <option value="medio" selected>Médio</option>
        <option value="dificil">Difícil</option>
      </select>

      <div class="players">
        <div class="player">
          <h2>Você:</h2>
          <img src="imgs/X.png" class="img1" />
        </div>

        <div class="player">
          <h2>IA:</h2>
          <img src="imgs/O.png" class="img2" />
        </div>
      </div>

      <div class="container-jogo">
        <div class="jogo">
          <div class="linha v1"></div>
          <div class="linha v2"></div>
          <div class="linha h1"></div>
          <div class="linha h2"></div>

          <div class="click" data-index="0"></div>
          <div class="click" data-index="1"></div>
          <div class="click" data-index="2"></div>
          <div class="click" data-index="3"></div>
          <div class="click" data-index="4"></div>
          <div class="click" data-index="5"></div>
          <div class="click" data-index="6"></div>
          <div class="click" data-index="7"></div>
          <div class="click" data-index="8"></div>
        </div>

        <div class="placar">
          <h2>Placar</h2>
          <p>Você: <span id="scoreX">0</span></p>
          <p>E: <span id="scoreDraw">0</span></p>
          <p>IA: <span id="scoreO">0</span></p>
          <button onclick="resetarPlacar()">Resetar</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
